apiVersion: 1

datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true

  - name: Disputes DB
    uid: disputes-db
    type: grafana-postgresql-datasource
    access: proxy
    url: db:5432
    user: grafana_reader
    jsonData:
      database: disputes
      sslmode: disable
      postgresVersion: 1600
    secureJsonData:
      password: ${GRAFANA_DB_PASSWORD}
